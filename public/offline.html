<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d19" />
    <title>AdaptAI — Offline</title>
    <style>
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f7f8fc; color: #1d2638; font: 16px system-ui, sans-serif; }
      main { max-width: 420px; padding: 32px; border: 1px solid #eaecf2; border-radius: 18px; background: white; text-align: center; box-shadow: 0 10px 35px #1d28400a; }
      h1 { margin: 0 0 10px; font-size: 24px; } p { color: #687489; line-height: 1.6; } button { margin-top: 12px; padding: 12px 18px; border: 0; border-radius: 9px; background: #7056e7; color: white; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>AdaptAI needs an internet connection to sign in and load or save workspace data. Reconnect, then try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
